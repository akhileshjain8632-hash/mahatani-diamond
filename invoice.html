<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062d2b">
<title>Mahatani Invoice Manager</title>
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#1b211b;--muted:#5d6760;--line:#d9ddd8;--line2:#eceee9;--green:#062d2b;--green2:#0a403b;--gold:#b7803d;--goldsoft:#f6ecd8;--danger:#b3261e;--ok:#1d7a46;--r:6px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,"Leelawadee UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:30;background:var(--green);color:#f4e7c8;border-bottom:3px solid var(--gold)}
.top-in{max-width:1400px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:inherit;text-decoration:none}
.brand img{width:62px;height:auto;display:block;background:#f4e7c8;border-radius:4px;padding:3px}
.brand b{display:block;font:normal 20px/1.1 Georgia,serif;letter-spacing:.12em}
.brand small{display:block;font-size:11px;letter-spacing:.3em;opacity:.85}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:#f4e7c8;text-decoration:none;padding:9px 14px;border:1px solid transparent;border-radius:var(--r);font-size:14px}
.nav a:hover{border-color:#b7803d99}
.nav a.on{background:#f4e7c822;border-color:#b7803d}
.cstat{font-size:12px;padding:4px 10px;border-radius:99px;background:#f4e7c822;border:1px solid #b7803d88}.cstat.ok{color:#bfe8c9}.cstat.bad{color:#ffb4ab}.cstat.wait{color:#f4e7c8}
.nav a.cta{background:var(--gold);color:#fff;font-weight:bold}
main{max-width:1400px;margin:auto;padding:18px 16px 60px}
.banner{background:#fff3cd;border:1px solid #e6c866;color:#5b4700;padding:10px 14px;border-radius:var(--r);margin:12px 16px 0;max-width:1368px}
@media(min-width:1432px){.banner{margin-left:auto;margin-right:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:var(--r);cursor:pointer;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.ghost{background:#fff;color:var(--ink);border-color:#b8beb6}
.btn.ghost:hover{background:#f0f2ee}
.btn.danger{background:#fff;color:var(--danger);border-color:#e3b3b0}
.btn.danger:hover{background:#fdecea}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.ib svg{width:16px;height:16px;flex:0 0 auto}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.ib:hover{background:#f0f2ee}.ib.del{color:var(--danger)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.tools .grow{flex:1 1 220px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.02em}
label.f>span{font-weight:bold;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;padding:9px 10px;border:1px solid #b8beb6;border-radius:var(--r);background:#fff;font-size:15px;min-width:0}
textarea{resize:vertical}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--goldsoft);border:1px solid #e3cfa3;border-radius:var(--r);margin-bottom:12px}
.bulk b{margin-right:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.inv{border-collapse:collapse;width:100%;min-width:980px}
table.inv th,table.inv td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;white-space:nowrap}
table.inv th{background:#f0f2ee;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0}
table.inv th.s{cursor:pointer}
table.inv td.n,table.inv th.n{text-align:right;font-variant-numeric:tabular-nums}
table.inv tr:hover td{background:#fafaf7}
table.inv tr.sel td{background:#fbf5e6}
table.inv td.cust{white-space:normal;min-width:200px;max-width:320px}
table.inv td.cust small{display:block;color:var(--muted)}
table.inv tfoot td{font-weight:bold;background:#f7f8f5;border-top:2px solid var(--line)}
.acts{display:flex;gap:5px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e9efe9;color:#26402e}
.tag.r{background:#f6ecd8;color:#6b4a14}
.empty{padding:46px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
/* editor */
.edit-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:16px;align-items:start}
@media(max-width:1020px){.edit-grid{grid-template-columns:1fr}}
.form fieldset{border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;padding:12px 14px 14px;min-width:0}
.form legend{padding:0 8px;font-weight:bold;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--green2)}
.row{display:grid;gap:10px;margin-bottom:10px}
.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}
.row.c3b{grid-template-columns:1.4fr 1fr 1fr}
@media(max-width:560px){.row.c2,.row.c3,.row.c3b{grid-template-columns:1fr}}
.items{display:grid;gap:6px}
.it{display:grid;grid-template-columns:26px minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.it.h{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.it .no{text-align:center;color:var(--muted);font-size:13px}
.it output{display:block;padding:9px 8px;background:#f0f2ee;border-radius:var(--r);text-align:right;font-variant-numeric:tabular-nums;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.it input{text-align:left}.it input.num{text-align:right}
@media(max-width:620px){.it{grid-template-columns:22px 1fr 1fr 32px}.it .desc{grid-column:2/5}.it.h{display:none}.it output{grid-column:2/4}}
.sum{margin-top:12px;display:grid;gap:4px;justify-content:end;font-variant-numeric:tabular-nums}
.sum div{display:grid;grid-template-columns:minmax(0,200px) 140px;gap:12px;text-align:right}
.sum .big{font-weight:bold;font-size:17px;border-top:2px solid var(--ink);padding-top:5px}
.opt{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.opt label{display:flex;gap:7px;align-items:center;cursor:pointer}
.opt input{width:auto}
.stickybar{position:sticky;bottom:0;background:linear-gradient(#fff0,#fff 20%);padding:12px 0 2px;display:flex;gap:8px;flex-wrap:wrap}
.pv{position:sticky;top:84px}
@media(max-width:1020px){.pv{position:static}}
.pv canvas{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff;box-shadow:0 2px 10px #0002}
.pv .note{font-size:12px;color:var(--muted);margin:8px 0 0}
.err{color:var(--danger);font-size:13px;margin:4px 0 0}
/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
@media(max-width:420px){.sgrid{grid-template-columns:1fr}}
.card h3{font-size:16px;margin-bottom:12px;color:var(--green2)}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
/* modal */
.mback{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal{background:#fff;border-radius:8px;max-width:760px;width:100%;box-shadow:0 20px 60px #0007}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-size:18px;margin-right:auto}
.mb{padding:16px 18px 20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;font-size:14px;color:var(--muted)}
.tabs button.on{color:var(--green);font-weight:bold;border-bottom-color:var(--gold)}
.grp{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:#fafbf9}
.grp h4{margin:0 0 8px;font-size:14px}
.grp .inl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qrbox{display:flex;gap:14px;align-items:center;margin:10px 0;padding:10px;background:#f6f6f2;border-radius:var(--r);font-size:13px;color:var(--muted)}
.qrbox canvas{width:96px;height:96px;background:#fff;border:1px solid var(--line);flex:0 0 auto}
.note2{background:#eef5ef;border:1px solid #cfe0d2;border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b211b;color:#fff;padding:11px 18px;border-radius:99px;z-index:90;font-size:14px;max-width:90vw;box-shadow:0 8px 24px #0005}
.busy{position:fixed;inset:0;background:#fffc;z-index:80;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--green)}
.spin{width:22px;height:22px;border:3px solid #cfd6cf;border-top-color:var(--gold);border-radius:50%;margin-right:12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

var GS_CODE=`// Mahatani Invoice Sync - paste into Extensions > Apps Script of your Google Sheet
var SECRET = 'CHANGE-THIS-SECRET';   // <-- put your own secret word here, and use the same one in the invoice tool
var SHEET_NAME = 'Invoices';
var HEAD = ['ID','Invoice No.','Date','Customer','Total (THB)','Updated','JSON (do not edit)'];

function getSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var s = ss.getSheetByName(SHEET_NAME);
  if (!s) {
    s = ss.insertSheet(SHEET_NAME);
    s.getRange('B:C').setNumberFormat('@');
    s.appendRow(HEAD);
    s.setFrozenRows(1);
    s.getRange(1, 1, 1, HEAD.length).setFontWeight('bold');
  }
  return s;
}
function reply_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function doGet() {
  return reply_({ ok: true, message: 'Mahatani invoice sync is running' });
}
function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    var r = JSON.parse(e.postData.contents);
    if (r.key !== SECRET) return reply_({ ok: false, error: 'Wrong secret key' });
    var s = getSheet_(), last = s.getLastRow();
    var ids = last > 1 ? s.getRange(2, 1, last - 1, 1).getValues().map(function (x) { return String(x[0]); }) : [];
    if (r.action === 'list') {
      var rows = last > 1 ? s.getRange(2, 7, last - 1, 1).getValues() : [];
      var out = [];
      rows.forEach(function (x) { try { out.push(JSON.parse(x[0])); } catch (err) {} });
      return reply_({ ok: true, invoices: out });
    }
    if (r.action === 'upsert') {
      r.invoices.forEach(function (inv) {
        var row = [inv.id, inv.no, inv.date, inv.cname, inv.total, new Date(), inv.json];
        var i = ids.indexOf(String(inv.id));
        if (i >= 0) s.getRange(i + 2, 1, 1, 7).setValues([row]);
        else { s.appendRow(row); ids.push(String(inv.id)); }
      });
      return reply_({ ok: true });
    }
    if (r.action === 'delete') {
      var del = [];
      r.ids.forEach(function (id) { var i = ids.indexOf(String(id)); if (i >= 0) del.push(i + 2); });
      del.sort(function (a, b) { return b - a; }).forEach(function (n) { s.deleteRow(n); });
      return reply_({ ok: true });
    }
    return reply_({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return reply_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

async function cloudCall(action,extra){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},30000);
  try{
    var r=await fetch(settings.cloudUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:settings.cloudKey,action:action},extra||{})),signal:ctl.signal});
    var j;try{j=await r.json()}catch(e){throw new Error('No valid answer from the web app address. Check the address and that access is set to "Anyone".')}
    if(!j.ok)throw new Error(j.error||'Sync error');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('Timed out');throw e}
  finally{clearTimeout(t)}
}
function cloudRec(inv){return {id:inv.id,no:inv.no,date:inv.date,cname:inv.cname,total:calcInv(inv).total/100,json:JSON.stringify(inv)}}
async function cloudPull(){
  if(!cloudOn())return;cstat('wait','Sheet: syncing…');
  try{var j=await cloudCall('list');lsSet('mdi.invoices.bak',invoices);invoices=j.invoices.filter(Boolean);saveInvoices();cstat('ok','Sheet: synced')}
  catch(e){cstat('bad','Sheet: offline');throw e}
}
async function cloudPush(list){
  if(!cloudOn()||!list.length)return;cstat('wait','Sheet: saving…');
  try{for(var i=0;i<list.length;i+=25)await cloudCall('upsert',{invoices:list.slice(i,i+25).map(cloudRec)});cstat('ok','Sheet: synced')}
  catch(e){cstat('bad','Sheet: not saved');toast('Saved on this device only. Google Sheet sync failed: '+e.message+' (Settings → Upload all, to retry)',6500);throw e}
}
async function cloudDelete(ids){
  if(!cloudOn()||!ids.length)return;cstat('wait','Sheet: saving…');
  try{await cloudCall('delete',{ids:ids});cstat('ok','Sheet: synced')}
  catch(e){cstat('bad','Sheet: not saved');toast('Deleted here, but the Google Sheet could not be updated: '+e.message,6500)}
}


/* ============ money / words ============ */
function calcInv(inv){
  var rate=inv.vatRate!=null&&inv.vatRate!==''?num(inv.vatRate):settings.vatRate, sub=0, wt=0, lines=[];
  (inv.items||[]).forEach(function(it){
    var has=(it.desc||'').trim()||String(it.weight||'').trim()||String(it.price||'').trim();
    if(!has)return;
    var w=num(it.weight),p=num(it.price),a=Math.round(w*p*100);
    sub+=a;wt+=w;lines.push({desc:it.desc||'',weight:w,price:p,amt:a,hasW:String(it.weight||'').trim()!==''});
  });
  var vat=Math.round(sub*rate/100);
  return {lines:lines,sub:sub,vat:vat,total:sub+vat,weight:Math.round(wt*1000)/1000,rate:rate};
}
var TH_D=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],TH_U=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
function thChunk(s,higher){
  var out='',len=s.length,other=false,i;
  for(i=0;i<len;i++){if(s[i]!=='0'&&i!==len-1)other=true}
  for(i=0;i<len;i++){
    var d=+s[i],pos=len-i-1;if(!d)continue;
    if(pos===0){out+=(d===1&&(other||higher))?'เอ็ด':TH_D[d]}
    else if(pos===1){out+=(d===1?'':d===2?'ยี่':TH_D[d])+'สิบ'}
    else out+=TH_D[d]+TH_U[pos];
  }
  return out;
}
function thInt(n){
  if(n===0)return 'ศูนย์';
  var s=String(n),parts=[];
  while(s.length>6){parts.unshift(s.slice(-6));s=s.slice(0,-6)}
  parts.unshift(s);
  var out='';
  parts.forEach(function(p,i){
    var higher=i>0, chunk=p.replace(/^0+(?=\d)/,'');
    if(+p===0&&i<parts.length-1){out+='ล้าน';return}
    out+=thChunk(i===0?chunk:p,i>0);
    if(i<parts.length-1)out+='ล้าน';
  });
  return out;
}
function bahtTh(sat){
  var b=Math.floor(sat/100),st=sat%100;
  return thInt(b)+'บาท'+(st?thInt(st)+'สตางค์':'ถ้วน');
}
var EN1=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],EN10=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  if(n===0)return 'Zero';var p=[];
  [[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']].forEach(function(u){if(n>=u[0]){p.push(enH(Math.floor(n/u[0]))+' '+u[1]);n%=u[0]}});

/* ============ PDF writer (A4, one JPEG per page) ============ */
var ENC=new TextEncoder();
function makePdf(pages,title){
  var chunks=[],len=0,off=[];
  function push(d){var u=typeof d==='string'?ENC.encode(d):d;chunks.push(u);len+=u.length}
  push(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  var n=pages.length,total=3+n*3;
  function obj(id,body){off[id]=len;push(id+' 0 obj\n'+body+'\nendobj\n')}
  function sobj(id,dict,bytes){off[id]=len;push(id+' 0 obj\n<< '+dict+' /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream\nendobj\n')}
  var kids=[];for(var i=0;i<n;i++)kids.push((4+i*3)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  obj(3,'<< /Title ('+String(title||'Invoice').replace(/[^\x20-\x7E]/g,'').replace(/([\\()])/g,'\\$1')+') /Producer (Mahatani Invoice Manager) /Creator (Mahatani Invoice Manager) >>');
  pages.forEach(function(p,j){
    var po=4+j*3,co=po+1,io=po+2;
    obj(po,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.276 841.89] /Resources << /XObject << /Im0 '+io+' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents '+co+' 0 R >>');
    sobj(co,'',ENC.encode('q 595.276 0 0 841.89 0 0 cm /Im0 Do Q'));
    sobj(io,'/Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode',p.bytes);
  });
  var xr=len;push('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(i=1;i<=total;i++)push(pad(off[i],10)+' 00000 n \n');
  push('trailer\n<< /Size '+(total+1)+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}

  var px=Math.floor(900/(qr.size+8)),S=(qr.size+8)*px,c=document.createElement('canvas');c.width=c.height=S;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);x.fillStyle='#000';
  for(var r=0;r<qr.size;r++)for(var q=0;q<qr.size;q++)if(qr.m[r][q])x.fillRect((q+4)*px,(r+4)*px,px,px);
  return new Promise(function(res){c.toBlob(res,'image/png')});
}
function qrCanvas(el){
  var u=qrUrl();if(!u)return;var qr=QR.make(u,'M');if(!qr)return;var px=6,S=(qr.size+4)*px;el.width=el.height=S;var x=el.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);x.fillStyle='#000';
  for(var r=0;r<qr.size;r++)for(var q=0;q<qr.size;q++)if(qr.m[r][q])x.fillRect((q+2)*px,(r+2)*px,px,px);
}
function blobToDataUrl(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b)})}

var layer=$('#layer');
function openModal(title,node,wide){
  closeModal();
  var back=document.createElement('div');back.className='mback';
  var m=document.createElement('div');m.className='modal'+(wide?' wide':'');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',title);
  m.innerHTML='<div class="mh"><h2>'+esc(title)+'</h2><button type="button" class="btn ghost sm" data-close>Close</button></div><div class="mb"></div>';
  $('.mb',m).appendChild(node);back.appendChild(m);layer.appendChild(back);
  back.addEventListener('mousedown',function(e){if(e.target===back)closeModal()});
  $('[data-close]',m).addEventListener('click',closeModal);
  document.addEventListener('keydown',escKey);
  var f=$('input,textarea,select,button.btn',$('.mb',m));if(f&&!wide)f.focus();

}
function escKey(e){if(e.key==='Escape')closeModal()}

function confirmDlg(msg,okLabel,danger){
  return new Promise(function(res){
    var n=document.createElement('div');
    n.innerHTML='<p style="margin:0 0 16px">'+esc(msg)+'</p><div class="stickybar" style="justify-content:flex-end;position:static"><button type="button" class="btn ghost" data-no>Cancel</button><button type="button" class="btn'+(danger?' danger':'')+'" data-yes>'+esc(okLabel||'OK')+'</button></div>';

    $('[data-yes]',m).addEventListener('click',function(){fin(true)});$('[data-no]',m).addEventListener('click',function(){fin(false)});

function filtered(){
  var q=filt.q.trim().toLowerCase();
  var r=invoices.filter(function(i){
    if(filt.doc&&i.docType!==filt.doc)return false;
    if(filt.from&&(i.date||'')<filt.from)return false;
    if(filt.to&&(i.date||'')>filt.to)return false;
    if(q){var hay=[i.no,i.cname,i.ctax,i.cemail,i.cphone,i.caddr].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
  var key=filt.sort,d=filt.dir;
  r.sort(function(a,b){
    var x,y;
    if(key==='total'){x=calcInv(a).total;y=calcInv(b).total;return (x-y)*d}
    if(key==='no'){return String(a.no).localeCompare(String(b.no),undefined,{numeric:true})*d}
    if(key==='cname'){return String(a.cname).localeCompare(String(b.cname))*d}
    x=(a.date||'')+(a.createdAt||'');y=(b.date||'')+(b.createdAt||'');return x<y?-d:x>y?d:0;
  });
  return r;
}

  var el=e.target.closest('button,th.s');if(!el)return;

  if(el.id==='xl'){exportExcel(sel.size?invoices.filter(function(i){return sel.has(i.id)}):filtered());return}

    var id=el.closest('tr').dataset.id,inv=invoices.filter(function(i){return i.id===id})[0];if(!inv)return;

async function doPdf(list,merge,mode){
  if(!list.length)return;
  var done=busy('Creating PDF…');
  try{var files=await pdfFor(list,mode,merge);done();done=null;files.forEach(function(f,i){setTimeout(function(){download(f.blob,f.name)},i*350)});toast(files.length+' PDF file'+(files.length>1?'s':'')+' downloaded')}
  catch(e){console.error(e);if(done)done();toast('Could not create the PDF: '+e.message,4500)}
}
async function deleteInvoices(ids){
  var nos=invoices.filter(function(i){return ids.indexOf(i.id)>=0}).map(function(i){return i.no});

  invoices=invoices.filter(function(i){return ids.indexOf(i.id)<0});ids.forEach(function(id){sel.delete(id)});saveInvoices();cloudDelete(ids);

  var map={f_no:'no',f_date:'date',f_cname:'cname',f_caddr:'caddr',f_ctax:'ctax',f_cemail:'cemail',f_cphone:'cphone',f_sn:'sellerName',f_sp:'sellerPosition',f_vat:'vatRate'};
  if(map[t.id]){draft[map[t.id]]=t.value}
  else if(t.id==='f_bank')draft.payment.bank=t.value;
  else if(t.id==='f_chq')draft.payment.chequeNo=t.value;
  else if(t.id==='f_due')draft.payment.dueDate=t.value;
  else if(t.id==='f_sw')draft.showWeight=t.checked;
  else if(t.dataset.f){var i=+t.closest('.it').dataset.i;draft.items[i][t.dataset.f]=t.value;syncAmts()}
  else return;
  syncSum();schedulePv();
});
editEl.addEventListener('change',function(e){
  var t=e.target;if(!draft)return;
  if(t.id==='f_doc'){draft.docType=t.value;schedulePv()}
  else if(t.name==='pm'){draft.payment.method=t.value;syncPay();schedulePv()}
  else if(t.id==='f_cname'){
    var c=editEl._custs&&editEl._custs[t.value.trim().toLowerCase()];
    if(c){var fill=function(id,key){var el=$('#'+id);if(!el.value){el.value=c[key]||'';draft[key]=c[key]||''}};fill('f_caddr','caddr');fill('f_ctax','ctax');fill('f_cemail','cemail');fill('f_cphone','cphone');syncSum();schedulePv()}
  }
});
editEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='price'){
    e.preventDefault();var i=+e.target.closest('.it').dataset.i;
    if(i===draft.items.length-1&&draft.items.length<MAX_ROWS){draft.items.push({desc:settings.defaultDesc,weight:'',price:''});renderItems();var r=$$('#items .it[data-i]');r[r.length-1].querySelector('[data-f=weight]').focus();schedulePv()}
    else{var nx=$$('#items .it[data-i]')[i+1];if(nx)nx.querySelector('[data-f=weight]').focus()}
  }
});
editEl.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el||!draft)return;
  if(el.id==='addRow'){if(draft.items.length<MAX_ROWS){draft.items.push({desc:settings.defaultDesc,weight:'',price:''});renderItems();var r=$$('#items .it[data-i]');r[r.length-1].querySelector('[data-f=weight]').focus();syncSum();schedulePv()}}
  else if(el.dataset.rm!==undefined){draft.items.splice(+el.dataset.rm,1);if(!draft.items.length)draft.items.push({desc:settings.defaultDesc,weight:'',price:''});renderItems();syncSum();schedulePv()}
  else if(el.id==='b_pdf'){if(validate(true))doPdf([cleanDraft()],false,settings.pdfMode)}
  else if(el.id==='b_print'){if(validate(true))printInvoices([cleanDraft()],settings.pdfMode)}
  else if(el.id==='b_send'){if(validate(true)){var inv=saveDraft(true);openSend([inv.id],'email')}}
  else if(el.id==='b_dup'){var cp=JSON.parse(JSON.stringify(draft));cp.id=uid();cp.no=nextNo(cp.date);cp.createdAt=undefined;editingId=null;draft=cp;invoices.push(Object.assign({},cp,{createdAt:new Date().toISOString()}));saveInvoices();cloudPush([invoices[invoices.length-1]]).catch(function(){});location.hash='#/edit/'+cp.id;toast('Duplicated as '+cp.no)}
  else if(el.id==='b_del'){deleteInvoices([editingId])}
});
editEl.addEventListener('submit',async function(e){e.preventDefault();if(cloudOn()){try{await cloudPull()}catch(x){}}if(!validate(false))return;var inv=saveDraft(false);toast('Saved '+inv.no);location.hash='#/edit/'+inv.id});
function cleanDraft(){
  var d=JSON.parse(JSON.stringify(draft));d.items=d.items.filter(function(i){return (i.desc||'').trim()||String(i.weight).trim()||String(i.price).trim()});
  d.vatRate=num(d.vatRate);return d;
}
function validate(soft){
  var ok=true,set=function(id,msg){var e=$('#'+id);if(msg){e.textContent=msg;e.hidden=false;ok=false}else e.hidden=true};
  var no=(draft.no||'').trim();
  var dup=invoices.some(function(i){return i.no===no&&i.id!==draft.id});
  set('e_doc',!no?'Enter an invoice number.':dup?'Invoice number '+no+' is already used. Choose a different number.':!draft.date?'Choose a date.':'');
  set('e_cust',!(draft.cname||'').trim()?'Enter the customer name.':'');
  var c=calcInv(draft);
  set('e_items',c.lines.length===0?'Add at least one item.':c.total<=0?'Enter weight and unit price so the amount is above zero.':'');
  if(!ok){var f=$('.err:not([hidden])');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});if(soft)toast('Please fix the highlighted fields')}
  return ok;
}
function saveDraft(silent){
  var d=cleanDraft();d.no=d.no.trim();d.cname=d.cname.trim();
  var ex=invoices.filter(function(i){return i.id===d.id})[0];
  if(ex){d.createdAt=ex.createdAt;d.updatedAt=new Date().toISOString();invoices[invoices.indexOf(ex)]=d}
  else{d.createdAt=new Date().toISOString();invoices.push(d)}
  saveInvoices();cloudPush([d]).catch(function(){});editingId=d.id;draft=JSON.parse(JSON.stringify(d));
  if(!silent&&location.hash!=='#/edit/'+d.id){/* handled by caller */}
  return d;
}

$('#view-settings').addEventListener('submit',async function(e){
  e.preventDefault();var oldC=settings.cloudUrl+'|'+settings.cloudKey;

    }catch(err){toast('Could not connect: '+err.message,5500)}

$('#view-settings').addEventListener('click',async function(e){
  var el=e.target.closest('button');if(!el)return;
  if(el.id==='ctest'||el.id==='cup'||el.id==='cdown'){
    var msg=$('#cmsg');settings.cloudUrl=$('#s_cloudUrl').value.trim();settings.cloudKey=$('#s_cloudKey').value.trim();saveSettings();
    if(!cloudOn()){msg.textContent='Enter the Web app URL and the secret key first.';return}
    msg.textContent='Working…';

      if(el.id==='ctest'){var j=await cloudCall('list');msg.textContent='Connected. The sheet has '+j.invoices.length+' invoice(s).';cstat('ok','Sheet: ready')}
      else if(el.id==='cup'){await cloudPush(invoices);msg.textContent='Uploaded '+invoices.length+' invoice(s) to the sheet.'}
      else if(await confirmDlg('Replace the invoices on this device with the ones in the Google Sheet?','Download')){await cloudPull();renderSettings();toast('Downloaded '+invoices.length+' invoice(s)')}
      else msg.textContent='';
    }catch(err){msg.textContent='Failed: '+err.message}
    return;
  }
  if(el.id==='gscopy'){try{await navigator.clipboard.writeText(GS_CODE);toast('Script copied')}catch(x){var ta=$('#gs');ta.select();toast('Press Ctrl+C to copy')}return}
  if(el.id==='bk'){download(new Blob([JSON.stringify({app:'mahatani-invoice-manager',version:1,exported:new Date().toISOString(),settings:settings,invoices:invoices},null,1)],{type:'application/json'}),'Mahatani_Invoices_backup_'+todayISO()+'.json');toast('Backup downloaded')}
  else if(el.id==='rs'){$('#rsf').click()}

  else if(el.id==='wipe'){if(await confirmDlg('Delete ALL '+invoices.length+' invoices from this browser? This cannot be undone.','Delete everything',true)){var allIds=invoices.map(function(i){return i.id});invoices=[];sel.clear();saveInvoices();cloudDelete(allIds);renderSettings();toast('All invoices deleted')}}
});
$('#view-settings').addEventListener('change',function(e){
  if(e.target.id!=='rsf')return;
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=async function(){
    try{
      var j=JSON.parse(rd.result);if(!j||!Array.isArray(j.invoices))throw new Error('This file is not an invoice backup.');
      if(!await confirmDlg('Restore '+j.invoices.length+' invoice(s)? This replaces the invoices and settings currently stored here.','Restore'))return;
      invoices=j.invoices;if(j.settings)settings=Object.assign({},DEFAULTS,j.settings);saveInvoices();saveSettings();renderSettings();toast('Backup restored');cloudPush(invoices).catch(function(){})
    }catch(err){toast('Could not restore: '+err.message,4500)}
  };rd.readAsText(f);e.target.value='';
});

/* ---- send modal ---- */
function groupBy(list,keyFn,labelFn){
  var m={},order=[];
  list.forEach(function(i){var k=keyFn(i);if(!m[k]){m[k]={key:k,invs:[],name:i.cname,email:i.cemail||'',phone:i.cphone||''};order.push(k)}m[k].invs.push(i);if(!m[k].email&&i.cemail)m[k].email=i.cemail;if(!m[k].phone&&i.cphone)m[k].phone=i.cphone});
  return order.map(function(k){return m[k]});
}
function openSend(ids,tab){
  var list=ids.map(function(id){return invoices.filter(function(i){return i.id===id})[0]}).filter(Boolean);
  if(!list.length)return;
  var S={tab:tab||'email',lang:settings.msgLang,mode:settings.pdfMode,qr:true,merge:false};
  var node=document.createElement('div');
  var m=openModal('Send '+(list.length===1?'invoice '+list[0].no:list.length+' invoices'),node,true);
  function groupsFor(t){
    return t==='email'?groupBy(list,function(i){return (i.cemail||'').trim().toLowerCase()||('n:'+i.cname)}):groupBy(list,function(i){return normPhone(i.cphone)||('n:'+i.cname)});
  }
  var groups=[];
  function render(){
    groups=groupsFor(S.tab);
    var canShare=!!(navigator.canShare&&navigator.share);
    var noteEmail='<div class="note2"><b>How sending works:</b> a web page cannot attach files to an email by itself. Press <b>1. Download PDFs</b>, then <b>2. Open email</b> and attach the downloaded files. On a phone, <b>Share PDFs</b> attaches them for you.</div>';
    var noteWa='<div class="note2"><b>How sending works:</b> WhatsApp and LINE cannot receive a file from a web page. Press <b>Open</b> to start the chat with the message ready, then attach the PDF you downloaded. On a phone, <b>Share PDFs</b> sends the file directly.</div>';
    node.innerHTML=
      '<div class="tabs" role="tablist"><button type="button" data-tab="email" class="'+(S.tab==='email'?'on':'')+'">Email</button><button type="button" data-tab="wa" class="'+(S.tab==='wa'?'on':'')+'">WhatsApp</button><button type="button" data-tab="line" class="'+(S.tab==='line'?'on':'')+'">LINE</button></div>'+
      '<div class="row c3"><label class="f"><span>PDF pages</span><select id="sd_mode"><option value="single"'+(S.mode==='single'?' selected':'')+'>This document only</option><option value="set"'+(S.mode==='set'?' selected':'')+'>Full set (4 pages)</option></select></label>'+
      '<label class="f"><span>Message language</span><select id="sd_lang"><option value="both"'+(S.lang==='both'?' selected':'')+'>English + ไทย</option><option value="en"'+(S.lang==='en'?' selected':'')+'>English</option><option value="th"'+(S.lang==='th'?' selected':'')+'>ไทย</option></select></label>'+
      '<label class="f"><span>Files</span><select id="sd_merge"><option value="0"'+(!S.merge?' selected':'')+'>One PDF per invoice</option><option value="1"'+(S.merge?' selected':'')+'>Merge into one PDF</option></select></label></div>'+
      (S.tab==='email'?noteEmail:noteWa)+
      (S.tab==='email'&&qrUrl()?'<div class="qrbox"><canvas id="sd_qr" aria-label="Website QR code"></canvas><div><b>Website QR code</b><br>Points to <span style="word-break:break-all">'+esc(qrUrl())+'</span><br><label style="display:inline-flex;gap:6px;align-items:center;margin-top:6px;cursor:pointer"><input type="checkbox" id="sd_qrcb"'+(S.qr?' checked':'')+'> Include the QR image with the files</label></div></div>':'')+
      groups.map(function(g,gi){
        var nm=g.name,inv=g.invs;
        if(S.tab==='email'){
          return '<div class="grp" data-g="'+gi+'"><h4>'+esc(nm)+' — '+inv.map(function(i){return esc(i.no)}).join(', ')+'</h4>'+
            '<div class="row c2"><label class="f"><span>To</span><input type="email" data-k="to" value="'+esc(g.email)+'" placeholder="customer@example.com"></label><label class="f"><span>Subject</span><input type="text" data-k="subj" value="'+esc(subjectEmail(inv,S.lang))+'"></label></div>'+
            '<label class="f"><span>Message</span><textarea data-k="body" rows="9">'+esc(bodyEmail(nm,inv,S.lang))+'</textarea></label>'+
            '<div class="inl"><button type="button" class="btn sm" data-act="dl">'+ICON.pdf+'1. Download PDFs'+(S.qr&&qrUrl()?' + QR':'')+'</button>'+
            '<button type="button" class="btn sm" data-act="mailto">'+ICON.mail+'2. Open email</button>'+
            '<button type="button" class="btn sm ghost" data-act="gmail">Open in Gmail</button>'+
            '<button type="button" class="btn sm ghost" data-act="copyhtml">'+ICON.copy+'Copy email with QR</button>'+
            (canShare?'<button type="button" class="btn sm gold" data-act="share">Share PDFs</button>':'')+'</div><div class="hint" data-msg></div></div>';
        }
        return '<div class="grp" data-g="'+gi+'"><h4>'+esc(nm)+' — '+inv.map(function(i){return esc(i.no)}).join(', ')+'</h4>'+
          (S.tab==='wa'?'<div class="row"><label class="f"><span>WhatsApp number</span><input type="tel" data-k="phone" value="'+esc(normPhone(g.phone))+'" placeholder="e.g. 66812345678"></label></div>':'')+

    var tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
    var el=e.target.closest('[data-act]');if(!el)return;
    var grpEl=el.closest('.grp'),g=groups[+grpEl.dataset.g],val=function(k){var x=$('[data-k='+k+']',grpEl);return x?x.value:''},msgEl=$('[data-msg]',grpEl),act=el.dataset.act;
    var say=function(t){msgEl.textContent=t};
    async function makeFiles(){
      var done=busy('Creating PDF…');
      try{var f=await pdfFor(g.invs,S.mode,S.merge);if(S.tab==='email'&&S.qr&&qrUrl()){var q=await qrPngBlob();if(q)f.push({name:'Mahatani_QR.png',blob:q})}return f}finally{done()}

    try{

      else if(act==='mailto'){
        var to=val('to').trim(),url='mailto:'+encodeURIComponent(to).replace(/%40/g,'@')+'?subject='+encodeURIComponent(val('subj'))+'&body='+encodeURIComponent(val('body').replace(/\n/g,'\r\n'));
        if(url.length>1900)say('Note: this message is long, and some email apps cut it off. If the text is incomplete, use “Open in Gmail” or “Copy email with QR”.');
        else say('Your email app should open now. Attach the PDFs you downloaded in step 1.');
        var a=document.createElement('a');a.href=url;document.body.appendChild(a);a.click();a.remove();
      }
      else if(act==='gmail'){window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(val('to'))+'&su='+encodeURIComponent(val('subj'))+'&body='+encodeURIComponent(val('body')),'_blank','noopener');say('Gmail opened in a new tab. Attach the PDFs you downloaded in step 1.')}
      else if(act==='copyhtml'){
        var q2=await qrPngBlob(),du=q2?await blobToDataUrl(q2):'';
        var html='<div style="font-family:Arial,sans-serif;font-size:14px;white-space:pre-wrap">'+esc(val('body'))+'</div>'+(du?'<p><img src="'+du+'" width="150" height="150" alt="QR code"><br><small>Scan to reach our website, WhatsApp and LINE</small></p>':'');
        if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([val('body')],{type:'text/plain'})})]);say('Copied. Paste into the email body (Ctrl+V). The QR image is pasted with the text.')}
        else{await navigator.clipboard.writeText(val('body'));say('Text copied (this browser cannot copy the QR image). Use “Download PDFs + QR” to get the QR picture.')}
      }
      else if(act==='wa'){var ph=normPhone(val('phone'));if(ph.length<9){say('Enter the customer’s WhatsApp number first (with country code, e.g. 66812345678).');return}window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(val('body')),'_blank','noopener');say('WhatsApp opened. Attach the PDF from your downloads (step: Download PDFs).')}
      else if(act==='line'){window.open('https://line.me/R/msg/text/?'+encodeURIComponent(val('body')),'_blank','noopener');say('LINE opened. Choose the customer’s chat, then attach the PDF.')}
      else if(act==='share'){
        var fl=await makeFiles(),files=fl.map(function(f){return new File([f.blob],f.name,{type:f.blob.type})});
        if(navigator.canShare&&navigator.canShare({files:files})){try{await navigator.share({files:files,title:val('subj')||'Invoice',text:val('body')});say('Shared.')}catch(er){if(er&&er.name!=='AbortError')say('Sharing failed: '+er.message)}}
        else say('This device cannot share files from the browser. Use Download PDFs instead.');
      }
    }catch(err){console.error(err);say('Something went wrong: '+err.message)}
  });
}

banner();
route();
if(cloudOn()){cstat('wait','Sheet: syncing…');cloudPull().then(function(){if(!location.hash.replace(/^#\/?/,''))renderList()}).catch(function(){})}
window.__mdi={calcInv:calcInv,bahtTh:bahtTh,bahtEn:bahtEn,QR:QR,buildXlsx:buildXlsx,makePdf:makePdf,renderCanvas:renderCanvas,pdfFor:pdfFor,get invoices(){return invoices},get settings(){return settings},bodyEmail:bodyEmail,normPhone:normPhone};
})();
