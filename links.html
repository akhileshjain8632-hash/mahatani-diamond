<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#062d2b">
<title>Mahatani Diamond Links</title>
<style>
:root{--green:#062d2b;--deep:#031f1e;--gold:#d8a85e;--gold2:#f0cf8a;--cream:#f5f0e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#0a403b,var(--green) 60%,var(--deep));color:var(--cream);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:40px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:150px;height:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
h1{margin:4px 0 0;font:normal 34px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.16em;color:#f4d69a;text-shadow:0 1px 0 #7b5226,0 2px 5px rgba(0,0,0,.45);text-align:center}
.sub{margin:0 0 18px;font-size:12px;letter-spacing:.5em;color:#eee1c8;padding-left:.5em}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:20px 22px;border:1px solid #c99b58;color:var(--gold2);font-size:15px;letter-spacing:.08em;text-decoration:none;background:rgba(3,31,30,.55);transition:background .2s,color .2s}
.link span:last-child{font-size:18px}
.link:hover,.link:focus-visible{background:var(--gold);color:#1b211b;outline:none}
.link.main{background:linear-gradient(120deg,#b7803d,#f0cf8a,#b7803d);color:#1b211b;border-color:var(--gold);font-weight:bold}
.link.main:hover,.link.main:focus-visible{filter:brightness(1.08)}
.foot{margin-top:16px;font-size:11px;letter-spacing:.14em;color:#a9a396;text-align:center}
</style>
