<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#062d2b">
<title>Mahatani Diamond Links</title>
<style>
:root{--green:#062d2b;--deep:#031f1e;--gold:#d8a85e;--gold2:#f0cf8a;--cream:#f5f0e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#0a403b,var(--green) 55%,var(--deep));color:var(--cream);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:0 0 44px;display:flex;flex-direction:column;align-items:center}
.hero{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent 100%);mask-image:linear-gradient(#000 55%,transparent 100%)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}

.brand{display:flex;flex-direction:column;align-items:center;padding:0 20px;margin-top:-6px}
.logo{width:112px;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
h1{margin:6px 0 0;font:normal 34px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.16em;color:#f4d69a;text-shadow:0 1px 0 #7b5226,0 2px 5px rgba(0,0,0,.45);text-align:center;padding-left:.16em}
.sub{margin:8px 0 0;font-size:12px;letter-spacing:.5em;color:#eee1c8;padding-left:.5em}
.links{width:100%;padding:28px 20px 0;display:flex;flex-direction:column;gap:14px}
.link{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;border:1px solid #c99b58;color:var(--gold2);font-size:16px;letter-spacing:.06em;text-decoration:none;background:rgba(3,31,30,.6);transition:background .2s,color .2s}
.link .ico{flex:0 0 44px;height:44px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center}
.link .txt{flex:1;min-width:0}
.link .go{font-size:18px}
.link:hover,.link:focus-visible{background:var(--gold);color:#1b211b;outline:none}
.link.main{background:linear-gradient(120deg,#b7803d,#f0cf8a,#b7803d);color:#1b211b;border-color:var(--gold);font-weight:bold}
.link.main:hover,.link.main:focus-visible{filter:brightness(1.08)}
.foot{margin:26px 0 0;font-size:11px;letter-spacing:.14em;color:#a9a396;text-align:center}
</style>
</head>
